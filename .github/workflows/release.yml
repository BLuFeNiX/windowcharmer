name: Release

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    needs: lint-and-test
    environment: release
    permissions:
      id-token: write  # required for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check windowcharmer/

      - name: ruff format check
        run: ruff format --check windowcharmer/ tests/

      - name: mypy
        run: mypy windowcharmer/

      - name: pytest
        run: pytest -v --cov=windowcharmer --cov-fail-under=70
