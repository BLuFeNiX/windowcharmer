[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windowcharmer"]

[project]
name = "windowcharmer"
version = "2026.4.1"
dependencies = [
  "python-xlib>=0.33,<1.0",
  "pyudev>=0.24.3,<1.0",
  "platformdirs>=4.0,<5.0",
]
requires-python = ">=3.11"
authors = [
  {name = "Chase Montgomery", email = "blufenix@blufenix.net"}
]
description = "A window tiler for ultra-wide monitors. Supports 3 columns."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["window", "tiler", "X", "Xlib", "columns", "cinnamon", "GTK", "Linux"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Environment :: X11 Applications",
  "Topic :: Desktop Environment :: Window Managers",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.4,<1.0",
  "mypy>=1.10,<2.0",
]

[project.urls]
Homepage = "https://github.com/BLuFeNiX/windowcharmer"
Documentation = "https://github.com/BLuFeNiX/windowcharmer"
Repository = "https://github.com/BLuFeNiX/windowcharmer"
"Bug Tracker" = "https://github.com/BLuFeNiX/windowcharmer/issues"

[project.scripts]
windowcharmer = "windowcharmer.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "pyudev"
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "SIM108",   # ternary-operator — readability preference
]
