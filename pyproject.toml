[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "windowcharmer"
version = "2026.4.2"
dependencies = [
  "python-xlib>=0.33,<1.0",
]
requires-python = ">=3.11"
authors = [
  {name = "Chase Montgomery", email = "blufenix@blufenix.net"}
]
description = "A window tiler for ultra-wide monitors. Supports 3 columns."
readme = "README.md"
license = {file = "LICENSE"}

[project.optional-dependencies]
cinnamon = [
  "PyGObject>=3.51,<4.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.4,<1.0",
  "mypy>=1.10,<2.0",
]

[project.scripts]
windowcharmer = "windowcharmer.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "B",     # flake8-bugbear
  "UP",    # pyupgrade
  "SIM",   # flake8-simplify
  "RUF",   # ruff-specific
  "N",     # pep8-naming
  "C4",    # flake8-comprehensions
  "PIE",   # flake8-pie (misc improvements)
  "RET",   # flake8-return
  "PERF",  # perflint
  "PTH",   # flake8-use-pathlib
  "ICN",   # flake8-import-conventions
  "PT",    # flake8-pytest-style
  "ERA",   # eradicate (commented-out code)
  "A",     # flake8-builtins (don't shadow)
]
ignore = [
  "SIM108",   # ternary-operator — readability preference
]
